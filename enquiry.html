<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Travel Enquiry | Nature Tours</title>
<link rel="icon" type="image/png" href="logo.png"><link rel="stylesheet" href="style.css">
<style>
body{background:#f7f7f5}.enquiry-wrap{max-width:900px;margin:0 auto;padding:130px 20px 60px}.enquiry-card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 40px #0001}.enquiry-card h1{margin-top:0}.enquiry-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.enquiry-field{display:flex;flex-direction:column;gap:7px}.enquiry-field.full{grid-column:1/-1}.enquiry-field label{font-weight:700}.enquiry-field input,.enquiry-field textarea{font:inherit;padding:12px;border:1px solid #ddd;border-radius:10px}.enquiry-field textarea{min-height:110px;resize:vertical}.enquiry-summary{background:#f5f5f2;border-radius:14px;padding:16px;margin:20px 0}.enquiry-item{padding:10px 0;border-bottom:1px solid #ddd}.enquiry-item:last-child{border-bottom:0}.enquiry-actions{display:flex;gap:10px;margin-top:20px}.enquiry-actions button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}.submit-btn{background:#111;color:#fff}.back-btn{background:#eee}.enquiry-success{display:none;text-align:center;padding:30px}.enquiry-success.show{display:block}.hidden{display:none!important}@media(max-width:650px){.enquiry-grid{grid-template-columns:1fr}.enquiry-field.full{grid-column:auto}.enquiry-actions{flex-direction:column}}
</style>
</head>
<body>
<header class="main-header"><div class="header-container"><div class="logo-area"><a href="index.html" style="text-decoration:none;display:flex;align-items:center"><img src="logo.png" alt="Nature Tours Logo" class="brand-logo"><div class="brand-text">Nature<span>Tours</span></div></a></div></div></header>
<main class="enquiry-wrap"><section class="enquiry-card" id="formView"><h1>📝 Travel Enquiry</h1><p>Tell us about your trip. Your selected Plan Cart items are already included below.</p><div class="enquiry-summary"><h2>Your selected plan</h2><div id="summary"></div></div>
<form id="enquiryForm"><div class="enquiry-grid"><div class="enquiry-field"><label for="name">Full name *</label><input id="name" name="name" required autocomplete="name"></div><div class="enquiry-field"><label for="phone">Mobile number *</label><input id="phone" name="phone" required type="tel" autocomplete="tel"></div><div class="enquiry-field"><label for="email">Email *</label><input id="email" name="email" required type="email" autocomplete="email"></div><div class="enquiry-field"><label for="date">Preferred travel date *</label><input id="date" name="date" required type="date"></div><div class="enquiry-field"><label for="travellers">Number of travellers *</label><input id="travellers" name="travellers" required type="number" min="1" value="1"></div><div class="enquiry-field"><label for="budget">Approx. budget per traveller</label><input id="budget" name="budget" placeholder="e.g. ₹25,000"></div><div class="enquiry-field full"><label for="requirements">Special requirements</label><textarea id="requirements" name="requirements" placeholder="Meals, transport, room preference, accessibility, etc."></textarea></div></div><div class="enquiry-actions"><button class="back-btn" type="button" id="back">← Back to Plan Cart</button><button class="submit-btn" type="submit">Send Enquiry on WhatsApp</button></div></form></section><section class="enquiry-card enquiry-success" id="success"><h1>✓ Enquiry prepared</h1><p>Your enquiry message has been opened in WhatsApp. Send it to Nature Tours to continue.</p><a href="index.html">Return to Nature Tours</a></section></main>
<script>
(function(){'use strict';const KEY='natureToursPlanCart',WA='919822339466',esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
const items=read(),summary=document.getElementById('summary');
if(!items.length){summary.innerHTML='<p>Your Plan Cart is empty. Please add a hotel or itinerary first.</p>';document.getElementById('enquiryForm').classList.add('hidden');}
else summary.innerHTML=items.map(x=>`<div class="enquiry-item"><strong>${esc(x.destination||'Trip')}</strong><br><small>${x.type==='itinerary'?esc(x.duration||'Itinerary'):'🏨 '+esc(x.hotel||'Hotel')}${x.type==='itinerary'&&x.hotel?' · Hotel: '+esc(x.hotel.name||x.hotel):''}</small></div>`).join('');
document.getElementById('back').onclick=()=>history.back();
document.getElementById('enquiryForm').addEventListener('submit',function(e){e.preventDefault();if(!items.length)return;const f=new FormData(this);const lines=['Hello Nature Tours, I would like to make a travel enquiry.','',`Name: ${f.get('name')}`,`Mobile: ${f.get('phone')}`,`Email: ${f.get('email')}`,`Preferred travel date: ${f.get('date')}`,`Travellers: ${f.get('travellers')}`,`Budget per traveller: ${f.get('budget')||'Not specified'}`,'','Selected plan:',...items.map((x,i)=>`${i+1}. ${x.destination||'Trip'} — ${x.type==='itinerary'?x.duration+' itinerary':'Hotel: '+(x.hotel||'')}${x.type==='itinerary'&&x.hotel?' — Hotel: '+(x.hotel.name||x.hotel):''}`),'',`Special requirements: ${f.get('requirements')||'None'}`];window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(lines.join('\n')),'_blank','noopener');document.getElementById('formView').classList.add('hidden');document.getElementById('success').classList.add('show');});
})();
</script>
</body></html>
