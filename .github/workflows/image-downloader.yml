name: Nature Tours Image Downloader

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/download-images.js"
      - ".github/workflows/image-downloader.yml"

permissions:
  contents: write

# Image generation changes only assets/. Keep one image run active so two
# refreshes cannot race and push competing commits over each other.
concurrency:
  group: nature-tours-image-downloader
  cancel-in-progress: false

jobs:
  download-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run image downloader
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FORCE_REFRESH_IMAGES: "true"
        run: node scripts/download-images.js

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Refresh travel attraction and hotel images"
            git push
          fi
